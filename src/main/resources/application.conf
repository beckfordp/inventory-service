port = 8080
port = ${?INVENTORY_SERVICE_PORT}

metrics-port = 9090
metrics-port = ${?INVENTORY_SERVICE_METRICS_PORT}

service-name = "inventory-service"
service-name = ${?INVENTORY_SERVICE_NAME}

postgres {
  host = "localhost"
  host = ${?POSTGRES_HOST}
  port = 5432
  port = ${?POSTGRES_PORT}
  database = "inventory"
  database = ${?POSTGRES_DB}
  user = "inventory"
  user = ${?POSTGRES_USER}
  password = "inventory"
  password = ${?POSTGRES_PASSWORD}
}

# example-client is not read by the live service (inventory-service has no
# outbound call to make) - it exists only so ClientResilienceExampleSuite can
# demonstrate loading a purerest ResilienceConfig via PureConfig, the same way
# a real downstream-calling client's config would be loaded in Main. See
# README's "Calling other services with resilience".
example-client {
  retry {
    max-retries = 5
    base-delay = 1ms
  }
  circuit-breaker {
    failure-threshold = 10
    reset-timeout = 1h
  }
}
